[flake8]
max-line-length = 120
max-complexity = 15
# Test fakes are dispatch tables by design; the CI lints metaquest only.
# B902 (flake8-blind-except) flags `except Exception`. The modules listed with B902 still hold
# broad handlers that have not been narrowed yet; each is removed from the list once it is.
# D101/D102/D103 (flake8-docstrings) require a docstring on every public class, method and
# function. They are enforced only on metaquest/data/registry.py, metaquest/data/sra/*.py,
# metaquest/cli/commands/store.py, metaquest/cli/commands/status.py,
# metaquest/processing/selection.py, metaquest/processing/results.py and metaquest/store/*.py;
# every other module is listed below with D101,D102,D103 ignored so the enforced set stays
# explicit and can grow later without a wildcard silently exempting new files.
# flake8 applies only the longest matching pattern, so a test file listed here repeats C901.
per-file-ignores =
    tests/*:C901,D101,D102,D103
    tests/test_security_comprehensive.py:C901,B902,D101,D102,D103
    metaquest/__init__.py:D101,D102,D103
    metaquest/cli/__init__.py:D101,D102,D103
    metaquest/cli/base.py:D101,D102,D103
    metaquest/cli/commands/__init__.py:D101,D102,D103
    metaquest/cli/commands/advanced_analysis.py:B902,D101,D102,D103
    metaquest/cli/commands/blacklist.py:D101,D102,D103
    metaquest/cli/commands/branchwater.py:D101,D102,D103
    metaquest/cli/commands/branchwater_search.py:D101,D102,D103
    metaquest/cli/commands/containment.py:D101,D102,D103
    metaquest/cli/commands/explore.py:D101,D102,D103
    metaquest/cli/commands/genome.py:D101,D102,D103
    metaquest/cli/commands/metadata.py:D101,D102,D103
    metaquest/cli/commands/read_extraction.py:B902,D101,D102,D103
    metaquest/cli/commands/results.py:D101,D102,D103
    metaquest/cli/commands/samples.py:D101,D102,D103
    metaquest/cli/commands/select.py:D101,D102,D103
    metaquest/cli/commands/sra.py:D101,D102,D103
