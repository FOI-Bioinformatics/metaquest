[flake8]
max-line-length = 120
max-complexity = 15
# Test fakes are dispatch tables by design; the CI lints metaquest only.
# B902 (flake8-blind-except) flags `except Exception`. The modules listed with B902 still hold
# broad handlers that have not been narrowed yet; each is removed from the list once it is.
# flake8 applies only the longest matching pattern, so a test file listed here repeats C901.
per-file-ignores =
    tests/*:C901
    tests/test_security_comprehensive.py:C901,B902
    metaquest/cli/commands/advanced_analysis.py:B902
    metaquest/cli/commands/read_extraction.py:B902
    metaquest/cli/commands/sra_enhanced.py:B902
    metaquest/cli/commands/sra_intelligent.py:B902
    metaquest/cli/main.py:B902
    metaquest/core/validation.py:B902
    metaquest/data/file_io.py:B902
    metaquest/data/genome_download.py:B902
    metaquest/data/read_extraction.py:B902
    metaquest/data/taxonomy.py:B902
    metaquest/plugins/formats/branchwater.py:B902
    metaquest/plugins/sourmash_plugin.py:B902
    metaquest/plugins/visualizers/bar.py:B902
    metaquest/plugins/visualizers/heatmap.py:B902
    metaquest/plugins/visualizers/map.py:B902
    metaquest/processing/containment.py:B902
    metaquest/processing/counts.py:B902
    metaquest/processing/diversity.py:B902
    metaquest/processing/statistics.py:B902
    metaquest/sra/analytics.py:B902
    metaquest/sra/reporting.py:B902
    metaquest/store/adopt.py:B902
    metaquest/store/stats.py:B902
    metaquest/store/usage.py:B902
    metaquest/utils/browser.py:B902
    metaquest/utils/html.py:B902
    metaquest/utils/security.py:B902
    metaquest/visualization/interactive.py:B902
    metaquest/visualization/plots.py:B902
extend-ignore = E203, W503
exclude = build,dist,.eggs,.git,__pycache__,.tox,.venv,venv