[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metaquest"
version = "0.3.1"
description = "A toolkit for analyzing metagenomic datasets based on genome containment"
readme = "README.md"
license = {text = "GPL-3.0"}
authors = [
    {name = "Andreas Sjödin", email = "andreas.sjodin@gmail.com"}
]
maintainers = [
    {name = "Andreas Sjödin", email = "andreas.sjodin@gmail.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Intended Audience :: Science/Research",
    "Development Status :: 4 - Beta",
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.1",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "numpy>=1.26",
    "scikit-learn>=1.3",
    "biopython>=1.82",
    "lxml>=4.9.3",
    "upsetplot>=0.9",
    "jinja2>=3.1",
    "plotly>=5.18",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "networkx>=3.2",
    "umap-learn>=0.5.5",
    "requests>=2.31",
]

[project.optional-dependencies]
maps = [
    "cartopy>=0.22",
]
sourmash = [
    "sourmash>=4.8",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-benchmark>=3.0.0",
    "flake8>=7.0",
    "black>=24.0",
    "mypy>=1.8",
    "radon>=6.0",
]
all = [
    "metaquest[maps,sourmash]",
]

[project.urls]
Homepage = "https://github.com/FOI-Bioinformatics/metaquest"
Repository = "https://github.com/FOI-Bioinformatics/metaquest"
Issues = "https://github.com/FOI-Bioinformatics/metaquest/issues"

[project.scripts]
metaquest = "metaquest.cli.main:main"

[project.entry-points."sourmash.cli_script"]
metaquest_parse = "metaquest.plugins.sourmash_plugin:MetaquestParsePlugin"
metaquest_plot = "metaquest.plugins.sourmash_plugin:MetaquestPlotPlugin"
metaquest_diversity = "metaquest.plugins.sourmash_plugin:MetaquestDiversityPlugin"
metaquest_taxonomy = "metaquest.plugins.sourmash_plugin:MetaquestTaxonomyPlugin"

[tool.setuptools.packages.find]
include = ["metaquest*"]

[tool.setuptools.package-data]
metaquest = ["py.typed"]

[tool.black]
line-length = 120
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
explicit_package_bases = true

# These third-party libraries ship no inline types, and their stub packages are
# not runtime dependencies. Missing-import errors from them are environmental
# noise rather than type defects, so they are ignored here.
[[tool.mypy.overrides]]
module = [
    "requests",
    "requests.*",
    "pandas",
    "pandas.*",
    "lxml",
    "lxml.*",
    "Bio",
    "Bio.*",
    "scipy",
    "scipy.*",
    "sklearn",
    "sklearn.*",
    "seaborn",
    "seaborn.*",
    "plotly",
    "plotly.*",
    "matplotlib",
    "matplotlib.*",
    "cartopy",
    "cartopy.*",
    "sourmash",
    "sourmash.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers -m 'not network'"
testpaths = ["tests"]
# Import the package from the checkout under test, not from the editable install's path,
# so a git worktree tests its own copy.
pythonpath = ["."]
markers = [
    "network: calls NCBI or SRA over the internet; run explicitly with 'pytest -m network'",
]

[tool.coverage.run]
source = ["metaquest"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]