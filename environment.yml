name: metaquest
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - pip
  - sra-tools>=3.0
  - pigz
  - ncbi-datasets-cli
  - minimap2>=2.17  # --sam-hit-only, used by extract_target_reads
  - samtools
  - megahit
  - sourmash
  # - seqkit  # optional: faster read statistics for sra_stats and sra_profile_quality
  - pip:
      - -e ".[all]"
