name: metaquest
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - pip
  - sra-tools>=3.0
  - pigz  # optional: falls back to Python's gzip module when absent; no version floor
  - ncbi-datasets-cli  # no version floor
  - minimap2>=2.17  # --sam-hit-only, used by extract_target_reads
  - samtools>=1.10  # samtools coverage, used by extract_target_reads
  - megahit>=1.2.9  # used by extract_target_reads --assemble
  - sourmash
  # - seqkit  # optional: faster read statistics for sra_profile and sra_report; no version floor
  - pip:
      - -e ".[all]"
